<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1A40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C3E7B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="400" height="400" fill="url(#sky)" />

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.2" fill="#FFFFFF" />
  <circle cx="120" cy="30" r="0.8" fill="#FFFFFF" />
  <circle cx="180" cy="50" r="1" fill="#FFFFFF" />
  <circle cx="250" cy="25" r="0.7" fill="#FFFFFF" />
  <circle cx="320" cy="45" r="1.3" fill="#FFFFFF" />
  <circle cx="370" cy="60" r="0.9" fill="#FFFFFF" />
  <circle cx="90" cy="80" r="1.1" fill="#FFFFFF" />
  <circle cx="200" cy="70" r="0.6" fill="#FFFFFF" />
  <circle cx="340" cy="90" r="1" fill="#FFFFFF" />
  <circle cx="30" cy="100" r="0.8" fill="#FFFFFF" />
  <circle cx="160" cy="110" r="1.2" fill="#FFFFFF" />
  <circle cx="290" cy="100" r="0.7" fill="#FFFFFF" />
  <circle cx="75" cy="140" r="0.9" fill="#FFFFFF" />
  <circle cx="230" cy="130" r="1" fill="#FFFFFF" />
  <circle cx="350" cy="140" r="0.8" fill="#FFFFFF" />
  <circle cx="130" cy="160" r="1.1" fill="#FFFFFF" />
  <circle cx="280" cy="150" r="0.6" fill="#FFFFFF" />
  <circle cx="40" cy="170" r="1" fill="#FFFFFF" />
  <circle cx="310" cy="180" r="0.9" fill="#FFFFFF" />
  <circle cx="190" cy="190" r="1.2" fill="#FFFFFF" />

  <!-- Crescent moon -->
  <circle cx="340" cy="70" r="28" fill="#F4ECD7" />
  <circle cx="355" cy="70" r="28" fill="#0F1A40" />

  <!-- Pine forest silhouette -->
  <!-- Tree 1 -->
  <polygon points="40,180 20,220 60,220" fill="#08102A" />
  <polygon points="50,200 30,240 70,240" fill="#08102A" />
  <polygon points="55,225 40,260 70,260" fill="#08102A" />

  <!-- Tree 2 -->
  <polygon points="100,170 75,220 125,220" fill="#08102A" />
  <polygon points="110,195 85,245 135,245" fill="#08102A" />
  <polygon points="115,220 95,265 135,265" fill="#08102A" />

  <!-- Tree 3 -->
  <polygon points="160,175 135,225 185,225" fill="#08102A" />
  <polygon points="170,200 145,250 195,250" fill="#08102A" />
  <polygon points="175,225 155,270 195,270" fill="#08102A" />

  <!-- Tree 4 -->
  <polygon points="220,180 195,230 245,230" fill="#08102A" />
  <polygon points="230,205 205,255 255,255" fill="#08102A" />
  <polygon points="235,230 215,275 255,275" fill="#08102A" />

  <!-- Tree 5 -->
  <polygon points="280,175 255,225 305,225" fill="#08102A" />
  <polygon points="290,200 265,250 315,250" fill="#08102A" />
  <polygon points="295,225 275,270 315,270" fill="#08102A" />

  <!-- Tree 6 -->
  <polygon points="340,185 315,235 365,235" fill="#08102A" />
  <polygon points="350,210 325,260 375,260" fill="#08102A" />
  <polygon points="355,235 335,280 375,280" fill="#08102A" />

  <!-- Tree 7 -->
  <polygon points="70,190 50,240 90,240" fill="#08102A" />
  <polygon points="80,215 60,265 100,265" fill="#08102A" />

  <!-- Tree 8 -->
  <polygon points="320,190 300,240 340,240" fill="#08102A" />
  <polygon points="330,215 310,265 350,265" fill="#08102A" />

  <!-- Snowy foreground hill -->
  <ellipse cx="200" cy="320" rx="200" ry="100" fill="#E8F0F7" />
  <polygon points="0,280 400,280 400,400 0,400" fill="#E8F0F7" />

  <!-- Sleeping fox body -->
  <ellipse cx="200" cy="290" rx="60" ry="50" fill="#E8783A" />

  <!-- Fox tail (curled) -->
  <path d="M 250 280 Q 290 270 300 310 Q 295 330 260 320" fill="#E8783A" />
  <path d="M 260 320 Q 275 325 280 310" fill="#B85518" />

  <!-- Fox head -->
  <circle cx="160" cy="260" r="35" fill="#E8783A" />

  <!-- Fox ears -->
  <polygon points="140,240 135,210 150,225" fill="#E8783A" />
  <polygon points="180,240 185,210 170,225" fill="#E8783A" />
  <polygon points="142,235 138,220 148,228" fill="#F4ECD7" />
  <polygon points="178,235 182,220 172,228" fill="#F4ECD7" />

  <!-- Fox snout -->
  <ellipse cx="145" cy="275" rx="18" ry="15" fill="#F4ECD7" />

  <!-- Fox nose -->
  <circle cx="140" cy="275" r="3" fill="#08102A" />

  <!-- Fox closed eye -->
  <path d="M 165 255 Q 170 253 175 255" stroke="#08102A" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Fox belly -->
  <ellipse cx="200" cy="305" rx="35" ry="30" fill="#F4ECD7" />

  <!-- Fox front paws -->
  <ellipse cx="180" cy="330" rx="12" ry="18" fill="#B85518" />
  <ellipse cx="210" cy="330" rx="12" ry="18" fill="#B85518" />

  <!-- Fox back paw (visible) -->
  <ellipse cx="245" cy="320" rx="10" ry="15" fill="#B85518" />

  <!-- Additional snow texture elements -->
  <circle cx="120" cy="350" r="3" fill="#F4ECD7" opacity="0.8" />
  <circle cx="280" cy="360" r="2.5" fill="#F4ECD7" opacity="0.8" />
  <circle cx="150" cy="370" r="2" fill="#F4ECD7" opacity="0.8" />
  <circle cx="320" cy="340" r="3.5" fill="#F4ECD7" opacity="0.8" />

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1A40"/>
      <stop offset="100%" stop-color="#2C3E7B"/>
    </linearGradient>
  </defs>

  <!-- Layer 1: Sky background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Layer 2: Stars -->
  <circle cx="50" cy="40" r="1" fill="#FFFFFF"/>
  <circle cx="80" cy="30" r="0.8" fill="#FFFFFF"/>
  <circle cx="120" cy="50" r="1.2" fill="#FFFFFF"/>
  <circle cx="150" cy="25" r="0.7" fill="#FFFFFF"/>
  <circle cx="180" cy="45" r="1" fill="#FFFFFF"/>
  <circle cx="220" cy="35" r="1.5" fill="#FFFFFF"/>
  <circle cx="250" cy="20" r="0.9" fill="#FFFFFF"/>
  <circle cx="280" cy="55" r="1.1" fill="#FFFFFF"/>
  <circle cx="320" cy="30" r="1.3" fill="#FFFFFF"/>
  <circle cx="350" cy="40" r="0.6" fill="#FFFFFF"/>
  <circle cx="380" cy="25" r="1" fill="#FFFFFF"/>
  <circle cx="60" cy="80" r="0.8" fill="#FFFFFF"/>
  <circle cx="90" cy="70" r="1.4" fill="#FFFFFF"/>
  <circle cx="130" cy="90" r="0.7" fill="#FFFFFF"/>
  <circle cx="160" cy="65" r="1.2" fill="#FFFFFF"/>
  <circle cx="200" cy="85" r="0.9" fill="#FFFFFF"/>
  <circle cx="240" cy="75" r="1.1" fill="#FFFFFF"/>
  <circle cx="270" cy="95" r="1.3" fill="#FFFFFF"/>
  <circle cx="310" cy="60" r="0.8" fill="#FFFFFF"/>
  <circle cx="340" cy="80" r="1" fill="#FFFFFF"/>

  <!-- Layer 3: Crescent Moon -->
  <circle cx="320" cy="80" r="30" fill="#F4ECD7"/>
  <circle cx="340" cy="80" r="30" fill="#0F1A40"/>

  <!-- Layer 4: Pine-Forest Silhouette -->
  <polygon points="0,200 30,150 60,200" fill="#08102A"/>
  <polygon points="30,200 60,140 90,200" fill="#08102A"/>
  <polygon points="60,200 90,130 120,200" fill="#08102A"/>
  <polygon points="90,200 120,145 150,200" fill="#08102A"/>
  <polygon points="120,200 150,135 180,200" fill="#08102A"/>
  <polygon points="150,200 180,140 210,200" fill="#08102A"/>
  <polygon points="180,200 210,130 240,200" fill="#08102A"/>
  <polygon points="210,200 240,145 270,200" fill="#08102A"/>
  <polygon points="240,200 270,135 300,200" fill="#08102A"/>
  <polygon points="270,200 300,140 330,200" fill="#08102A"/>
  <polygon points="300,200 330,150 360,200" fill="#08102A"/>

  <!-- Layer 5: Snowy Foreground Hill -->
  <path d="M0,250 Q200,300 400,250 L400,400 L0,400 Z" fill="#E8F0F7"/>

  <!-- Layer 6: Sleeping Fox -->
  <!-- Body -->
  <ellipse cx="200" cy="300" rx="40" ry="25" fill="#E8783A"/>
  <!-- Belly -->
  <ellipse cx="200" cy="315" rx="30" ry="15" fill="#F4ECD7"/>
  <!-- Head -->
  <circle cx="170" cy="290" r="15" fill="#E8783A"/>
  <!-- Ear -->
  <polygon points="160,275 165,260 175,270" fill="#E8783A"/>
  <polygon points="175,270 180,255 185,275" fill="#E8783A"/>
  <!-- Tail -->
  <path d="M240,300 Q260,280 270,300 Q280,320 250,320 Z" fill="#E8783A"/>
  <path d="M265,295 Q275,285 280,295 Q285,310 260,310 Z" fill="#B85518"/>
  <!-- Paws -->
  <ellipse cx="180" cy="320" rx="8" ry="5" fill="#B85518"/>
  <ellipse cx="220" cy="320" rx="8" ry="5" fill="#B85518"/>
  <!-- Eye -->
  <path d="M165,285 Q168,283 170,285" fill="none" stroke="#08102A" stroke-width="1"/>
  <!-- Nose -->
  <circle cx="160" cy="295" r="2" fill="#08102A"/>
</svg>
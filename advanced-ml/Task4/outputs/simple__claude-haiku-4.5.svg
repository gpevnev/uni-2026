<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hexPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="#2E86AB" stroke-width="2"/>
      <circle cx="50" cy="50" r="15" fill="#A23B72"/>
    </pattern>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F18F01;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C73E1D;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <rect width="400" height="400" fill="#F5F5F5"/>
  
  <rect width="400" height="400" fill="url(#hexPattern)"/>
  
  <circle cx="100" cy="100" r="40" fill="url(#grad1)" opacity="0.7"/>
  <circle cx="300" cy="100" r="40" fill="#2E86AB" opacity="0.6"/>
  <circle cx="100" cy="300" r="40" fill="#A23B72" opacity="0.6"/>
  <circle cx="300" cy="300" r="40" fill="#F18F01" opacity="0.7"/>
  
  <g stroke="#2E86AB" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
    <line x1="75" y1="75" x2="325" y2="325"/>
    <line x1="325" y1="75" x2="75" y2="325"/>
  </g>
  
  <g fill="#A23B72" opacity="0.4">
    <rect x="40" y="40" width="20" height="20" transform="rotate(45 50 50)"/>
    <rect x="340" y="40" width="20" height="20" transform="rotate(45 350 50)"/>
    <rect x="40" y="340" width="20" height="20" transform="rotate(45 50 350)"/>
    <rect x="340" y="340" width="20" height="20" transform="rotate(45 350 350)"/>
  </g>
  
  <circle cx="200" cy="200" r="60" fill="none" stroke="#F18F01" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="200" r="40" fill="none" stroke="#2E86AB" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="200" r="20" fill="none" stroke="#A23B72" stroke-width="2" opacity="0.5"/>
</svg>